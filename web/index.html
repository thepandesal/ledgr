<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Ledgr</title>
    <link rel="icon" type="image/png" href="/assets/white.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=MuseoModerno:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: 'Poppins', sans-serif; }
      /* Map RN font names to CSS */
      [style*="Poppins-Regular"] { font-family: 'Poppins', sans-serif !important; font-weight: 400; }
      [style*="Poppins-Medium"] { font-family: 'Poppins', sans-serif !important; font-weight: 500; }
      [style*="Poppins-SemiBold"] { font-family: 'Poppins', sans-serif !important; font-weight: 600; }
      [style*="Poppins-Bold"] { font-family: 'Poppins', sans-serif !important; font-weight: 700; }
      [style*="MuseoModerno-ExtraBold"] { font-family: 'MuseoModerno', sans-serif !important; font-weight: 800; }
      [style*="MuseoModerno-Medium"] { font-family: 'MuseoModerno', sans-serif !important; font-weight: 500; }
      [style*="MuseoModerno-Regular"] { font-family: 'MuseoModerno', sans-serif !important; font-weight: 400; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var blocked = false;
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'hidden') {
            blocked = true;
            setTimeout(function() { blocked = false; }, 5000);
          }
        });
        // Intercept all possible reload mechanisms
        var _reload = location.reload.bind(location);
        location.reload = function() {
          console.log('[reload intercepted] location.reload, blocked:', blocked);
          if (blocked) return;
          _reload();
        };
        // Intercept WebSocket to log messages from dev server
        var _WS = window.WebSocket;
        window.WebSocket = function(url, protocols) {
          var ws = protocols ? new _WS(url, protocols) : new _WS(url);
          var origAddEventListener = ws.addEventListener.bind(ws);
          ws.addEventListener = function(type, handler, opts) {
            if (type === 'message') {
              origAddEventListener(type, function(e) {
                try {
                  var data = JSON.parse(e.data);
                  console.log('[ws message]', data.type || data);
                  if (blocked && (data.type === 'reload' || data.type === 'reloadApp')) {
                    console.log('[ws reload blocked]');
                    return;
                  }
                } catch(err) {}
                handler(e);
              }, opts);
            } else {
              origAddEventListener(type, handler, opts);
            }
          };
          return ws;
        };
        window.WebSocket.prototype = _WS.prototype;
      })();
    </script>
  </body>
</html>
