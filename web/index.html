<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ledgr</title>
    <link rel="icon" type="image/png" href="/assets/white.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      @font-face {
        font-family: 'CalSans';
        src: url('/assets/CalSans-Regular.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: 'DM Sans', sans-serif; }
      /* Map RN font names to CSS */
      [style*="DMSans_400Regular"] { font-family: 'DM Sans', sans-serif !important; font-weight: 400; }
      [style*="DMSans_600SemiBold"] { font-family: 'DM Sans', sans-serif !important; font-weight: 600; }
      [style*="DMSans_700Bold"] { font-family: 'DM Sans', sans-serif !important; font-weight: 700; }
      [style*="CalSans"] { font-family: 'CalSans', serif !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
