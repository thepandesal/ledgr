workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    cache:
      cache_paths: []
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: art.ledgr.app
      vars:
        BUNDLE_ID: art.ledgr.app
        XCODE_WORKSPACE: ios/ledgr.xcworkspace
        XCODE_SCHEME: Ledgr
      node: 20.18.0
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Clear React Native prebuilt cache
        script: |
          find /Users/builder/Library/Developer/Xcode/DerivedData -name 'React.framework' -exec rm -rf {} + 2>/dev/null || true
          find ~/.npm -name 'react-native-core-prebuilt*' -exec rm -rf {} + 2>/dev/null || true
          find /Users/builder/clone/node_modules/react-native -name '*.xcframework' -exec rm -rf {} + 2>/dev/null || true
      - name: Write env file
        script: |
          cat > .env << 'EOF'
          EXPO_PUBLIC_SUPABASE_URL=https://vzylpnuvsuianmuwqsnr.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_SE1OPKy63BYHkZfQkbIb_A_nAgXKGTQ
          EXPO_PUBLIC_R2_ENDPOINT=https://8095a062e38cbfdda1283f4df7a57621.r2.cloudflarestorage.com
          EXPO_PUBLIC_R2_ACCESS_KEY=a0a80ae15d748c118b0d5f742b0c3cd0
          EXPO_PUBLIC_R2_SECRET_KEY=aaed9dc2a6e6cc13a8c542bf6347c78ec7b8ce895d39cd485c4aca5c2a8fd5c4
          EXPO_PUBLIC_R2_BUCKET=ledgr-receipts
          EXPO_PUBLIC_R2_PUBLIC_URL=https://cdn.ledgr.art
          EOF
      - name: Expo prebuild
        script: npx expo prebuild --clean --platform ios
      - name: Install CocoaPods
        script: cd ios && pod repo update && pod install --clean-install
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --xcarg "USE_CCACHE=0"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
